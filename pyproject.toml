[project]
name = "ds-team-agents"
version = "0.1.0"
description = "Multi-agent system for DS team management in metallurgy"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.8.0",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
storage = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
]
integrations = [
    "python-telegram-bot>=21.0",
    "jira>=3.8",
    "google-api-python-client>=2.130",
]

[project.scripts]
ds-agents = "ds_team_agents.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
